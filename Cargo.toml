[package]
name = "logi-lite"
version = "0.1.0"
edition = "2024"
description = "A small native Windows and macOS utility for mouse shortcuts and Logitech device settings"
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_Graphics_Gdi"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
